<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Tribuna | El periódico de los deportistas</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#eeeae2;
  color:#111;
  font-family:Georgia,"Times New Roman",serif;
}

header{
  background:#f7f5ef;
  border-bottom:3px solid #071b2c;
}

.masthead{
  display:grid;
  grid-template-columns:180px 1fr 180px;
  align-items:center;
  padding:18px 25px 12px;
  gap:20px;
}

.date{
  font-size:14px;
  line-height:1.35;
  border-right:1px solid #999;
  padding-right:15px;
}

.brand{
  text-align:center;
}

.brand h1{
  margin:0;
  font-size:clamp(45px,8vw,105px);
  line-height:.85;
  letter-spacing:-4px;
}

.brand p{
  margin:12px 0 0;
  font-size:14px;
  letter-spacing:6px;
}

.champions{
  text-align:center;
  font-size:15px;
  line-height:1.4;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  background:#f7f5ef;
  border-top:1px solid #999;
  border-bottom:1px solid #999;
}

nav a{
  color:#111;
  text-decoration:none;
  padding:12px 22px;
  font-weight:bold;
  font-size:14px;
  letter-spacing:1px;
}

nav a:hover{
  background:#071b2c;
  color:white;
}

.breaking{
  background:#071b2c;
  color:white;
  padding:10px 20px;
  font-weight:bold;
  letter-spacing:3px;
  text-align:center;
}

.container{
  width:min(1450px,94%);
  margin:25px auto 50px;
}

.intro{
  text-align:center;
  margin-bottom:25px;
}

.intro h2{
  font-size:clamp(28px,5vw,58px);
  margin:0 0 8px;
  text-transform:uppercase;
}

.intro p{
  margin:0;
  font-size:18px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

.article{
  background:#f8f6f0;
  border:1px solid #bbb;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.article.featured{
  grid-column:1/-1;
}

.image-wrap{
  width:100%;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* IMPORTANTE:
   La imagen conserva TODA su proporción.
   No usamos object-fit:cover.
*/
.article img{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
}

.article-content{
  padding:20px 24px 25px;
}

.category{
  color:#5d6570;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:8px;
}

.article h3{
  margin:0 0 10px;
  font-size:clamp(22px,3vw,38px);
  line-height:1;
  text-transform:uppercase;
}

.article p{
  font-size:17px;
  line-height:1.5;
  margin:0;
}

.meryem{
  border-top:6px solid #071b2c;
}

.jude{
  border-top:6px solid #8b171
